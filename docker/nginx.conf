# Phục vụ bản build SPA của MAMCG.frontend (chạy bằng user không phải root, cổng 8080)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Security headers (áp dụng cho mọi response, kể cả lỗi)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # File có hash trong tên: cache lâu dài
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Không dùng "always": 404 không được cache lâu dài
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Healthcheck cho Docker
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # SPA: mọi route còn lại trả về index.html, không cache
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
